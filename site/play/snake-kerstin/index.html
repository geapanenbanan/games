<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b4a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Snake – Kerstin edition</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b4a8a;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:'Rubik',system-ui,sans-serif;}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #sa{position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden}
  #sb{position:fixed;bottom:0;left:0;width:1px;height:env(safe-area-inset-bottom,0px);visibility:hidden}
  #hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;
    justify-content:space-between;align-items:center;pointer-events:none;z-index:2}
  .row{display:flex;gap:8px;align-items:center}
  .pill{background:rgba(15,12,35,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:5px 16px;
    font-weight:700;color:#fff;font-size:17px;line-height:1.5;letter-spacing:.5px;border:1px solid rgba(255,255,255,.12)}
  .pill span{opacity:.6;font-weight:500;margin-right:6px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px}
  .iconbtn{pointer-events:auto;border:1px solid rgba(255,255,255,.12);width:42px;height:42px;border-radius:50%;background:rgba(15,12,35,.62);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:17px;cursor:pointer;padding:0;color:#fff}
  .iconbtn:active{transform:scale(.92)}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:3;text-align:center;padding:24px;box-sizing:border-box;background:rgba(10,8,30,.45)}
  .hidden{display:none!important}
  .card{background:rgba(22,18,48,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);
    border-radius:22px;padding:22px 22px 18px;max-width:340px;width:100%;box-sizing:border-box;
    box-shadow:0 24px 60px rgba(0,0,0,.45);color:#e9e6ff;animation:pop .35s cubic-bezier(.2,1.15,.4,1)}
  @keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  @keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg) scale(1.05)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  h1{margin:0;font-size:76px;line-height:.9;font-weight:900;letter-spacing:10px;padding-left:10px;
    background:linear-gradient(#ffe7a3,#ffc24a 55%,#e88a1a);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #6b2c0e) drop-shadow(0 12px 24px rgba(0,0,0,.45))}
  .sub{font-size:15px;font-weight:500;color:#fff;letter-spacing:7px;text-transform:uppercase;margin-top:14px;
    display:flex;align-items:center;gap:12px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .sub::before,.sub::after{content:'';width:28px;height:1px;background:rgba(255,255,255,.6)}
  #demo{width:300px;max-width:90vw;height:96px;display:block;margin:6px auto 4px}
  .btn{border:0;font-family:inherit;font-weight:700;font-size:19px;letter-spacing:2px;text-transform:uppercase;padding:13px 38px;border-radius:14px;
    background:linear-gradient(#ffd56b,#f0a62a);color:#2a1440;box-shadow:0 4px 0 #9c5f0c,0 10px 20px rgba(0,0,0,.3);margin:10px 4px 2px;cursor:pointer}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9c5f0c}
  .btn.alt{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35);font-size:15px;padding:13px 24px}
  .btn.alt:active{box-shadow:0 1px 0 rgba(0,0,0,.35)}
  p{margin:6px 0;font-size:15px;line-height:1.45;font-weight:400;color:#c9c3ea}
  .best{font-weight:700;color:#ffd25e;font-size:15px;margin-top:10px;letter-spacing:1px}
  .credit{margin-top:16px;color:rgba(255,255,255,.7);font-weight:500;font-size:12px;letter-spacing:3px;text-transform:uppercase}
  .big{font-size:28px;font-weight:700;color:#fff;line-height:1.1}
  .scoreBig{font-size:68px;font-weight:900;line-height:1;color:#ffd25e;margin-top:8px}
  .badge{display:inline-block;border:1px solid #ffd25e;color:#ffd25e;font-weight:700;font-size:12px;letter-spacing:3px;padding:3px 12px;border-radius:999px;margin-top:10px}
.skins{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 2px}
  .skin{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer}
  .skin.on{background:#ffd25e;color:#2a1440;border-color:#ffd25e;font-weight:700}
  #top{list-style:none;padding:0;margin:12px 0 6px;text-align:left}
  #top li{display:flex;gap:12px;align-items:center;padding:5px 12px;border-radius:10px;font-size:16px;border-bottom:1px solid rgba(255,255,255,.06)}
  #top li span{opacity:.5;width:14px}
  #top li b{flex:1}
  #top li small{opacity:.6;font-weight:600}
  #top li.me{background:rgba(255,210,94,.16);color:#ffd25e}
</style>
</head>
<body>
<div id="sa"></div><div id="sb"></div>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="pill" id="sc"><span>Poäng</span>0</div>
  <div class="row">
    <div class="pill" id="bs"><span>Bäst</span>0</div>
    <button class="iconbtn" id="mute" aria-label="Ljud">🔊</button>
    <button class="iconbtn" id="pauseBtn" aria-label="Paus">⏸</button>
  </div>
</div>

<div id="menu" class="overlay">
  <h1>SNAKE</h1>
  <div class="sub">Kerstin edition</div>
  <canvas id="demo"></canvas>
  <div class="card">
    <p>Svep för att styra. Varje godis förlänger kedjan och höjer tempot.</p>
    <p>Ät i snabb följd för kombo. Doktor Smul tappar ibland en guldstjärna värd 50 poäng.</p>
    <div class="skins" id="skins"></div>
    <div class="best" id="menuBest"></div>
    <button class="btn" id="play">SPELA!</button>
  </div>
  <div class="credit">Rostyfrosty</div>
</div>

<div id="pause" class="overlay hidden">
  <div class="card">
    <div class="big">Paus</div>
    <p>Spelet väntar på dig.</p>
    <button class="btn" id="resume">Fortsätt</button>
    <button class="btn alt" id="quit">Meny</button>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <div class="big" id="ovTitle">Aj då!</div>
    <div id="recordBadge" class="badge hidden">NYTT REKORD</div>
    <div class="scoreBig" id="ovScore">0</div>
    <p id="ovInfo"></p>
    <ol id="top"></ol>
    <button class="btn" id="again">Spela igen</button>
    <button class="btn alt" id="toMenu">Meny</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const dc=$('demo'),dctx=dc.getContext('2d');
const COLORS=['#e84a7f','#23a9d6','#5fb83a','#8a5cf0','#f2802f','#17bf98'];
const HEAD='#d6336c';
const TYPES=['cup','donut','cookie'];
const TAU=Math.PI*2;

const store={
  get(k,d){try{const v=localStorage.getItem('kerstinSnake_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('kerstinSnake_'+k,JSON.stringify(v));}catch(e){}}
};
let scores=store.get('top',[]); if(!Array.isArray(scores))scores=[];
let muted=!!store.get('muted',false);

let W=0,H=0,DPR=1;
const G={cols:14,rows:20,cell:24,ox:0,oy:0};
let state='menu',snake=null,prev=[],dir={x:0,y:-1},queue=[],food=null,bonus=null,villain=null;
let score=0,combo=0,lastEat=-99,acc=0,interval=170,eaten=0,grow=0,colorIdx=0,nextVillain=0,deathT=0,shake=0,flash=0,t=0,mouth=0;
let parts=[],floats=[],clouds=[];
const bgC=document.createElement('canvas'),boardC=document.createElement('canvas');let dirty=true;

/* ---------- layout ---------- */
function metrics(){const st=$('sa').offsetHeight||0,sb=$('sb').offsetHeight||0;return{top:st+66,bot:sb+12,side:10};}
function chooseGrid(){
  const m=metrics();const portrait=H>=W*0.9;
  G.cols=portrait?14:24;
  const cell=Math.min((W-m.side*2)/G.cols,44);
  G.rows=Math.max(12,Math.min(32,Math.floor((H-m.top-m.bot)/cell)));
  fit();
}
function fit(){
  const m=metrics();const aw=W-m.side*2,ah=H-m.top-m.bot;
  G.cell=Math.min(aw/G.cols,ah/G.rows);
  G.ox=(W-G.cell*G.cols)/2;G.oy=m.top+(ah-G.cell*G.rows)/2;dirty=true;
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  if(state==='menu'||!snake)chooseGrid();else fit();
  if(!clouds.length)for(let i=0;i<6;i++)clouds.push({x:Math.random()*W,y:20+Math.random()*H*.8,s:40+Math.random()*50,v:6+Math.random()*12});
}
const cxp=x=>G.ox+(x+.5)*G.cell, cyp=y=>G.oy+(y+.5)*G.cell;
const lerp=(a,b,k)=>a+(b-a)*k;
function easeOutBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function buildCaches(){
  for(const c of[bgC,boardC]){c.width=cv.width;c.height=cv.height;}
  let g=bgC.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1e3466');gr.addColorStop(.45,'#5b5f9e');gr.addColorStop(.75,'#e58a5c');gr.addColorStop(1,'#ffc98a');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  const sg=g.createRadialGradient(W*.8,H*.78,5,W*.8,H*.78,Math.max(W,H)*.45);sg.addColorStop(0,'rgba(255,230,160,.95)');sg.addColorStop(.12,'rgba(255,190,110,.6)');sg.addColorStop(1,'rgba(255,150,90,0)');
  g.fillStyle=sg;g.fillRect(0,0,W,H);
  g.fillStyle='#3d5f3a';g.beginPath();g.ellipse(W*.2,H*1.04,W*.65,H*.24,0,0,TAU);g.fill();
  g.fillStyle='#2c4a2e';g.beginPath();g.ellipse(W*.9,H*1.08,W*.55,H*.22,0,0,TAU);g.fill();

  g=boardC.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);
  const {ox,oy,cell,cols,rows}=G,bw=cols*cell,bh=rows*cell,pad=Math.max(5,cell*.25);
  g.fillStyle='rgba(10,10,30,.35)';rr(g,ox-pad,oy-pad+10,bw+pad*2,bh+pad*2,18);g.fill();
  g.fillStyle='#2f5e2b';rr(g,ox-pad,oy-pad,bw+pad*2,bh+pad*2,18);g.fill();
  g.fillStyle='#4a8a3c';rr(g,ox-pad,oy-pad,bw+pad*2,pad*.8,10);g.fill();
  g.save();rr(g,ox,oy,bw,bh,12);g.clip();
  g.fillStyle='#78b955';g.fillRect(ox,oy,bw,bh);
  g.fillStyle='#6dae4c';
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if((x+y)%2)g.fillRect(ox+x*cell,oy+y*cell,cell+.5,cell+.5);
  let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<cols*rows*.12;i++){
    const x=ox+rnd()*bw,y=oy+rnd()*bh;
    if(rnd()<2){g.strokeStyle='rgba(40,90,30,.35)';g.lineWidth=Math.max(1,cell*.05);g.beginPath();
      g.moveTo(x-cell*.08,y-cell*.12);g.lineTo(x,y);g.lineTo(x+cell*.08,y-cell*.14);g.stroke();}
    else{g.fillStyle=['#fff','#ffe066','#ffb3d1'][Math.floor(rnd()*3)];
      for(let k=0;k<5;k++){const a=k/5*TAU;g.beginPath();g.arc(x+Math.cos(a)*cell*.07,y+Math.sin(a)*cell*.07,cell*.05,0,TAU);g.fill();}
      g.fillStyle='#ffb300';g.beginPath();g.arc(x,y,cell*.04,0,TAU);g.fill();}
  }
  const ig=g.createLinearGradient(0,oy,0,oy+cell*.6);ig.addColorStop(0,'rgba(0,0,0,.12)');ig.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=ig;g.fillRect(ox,oy,bw,cell*.6);
  const vg=g.createRadialGradient(ox+bw*.5,oy+bh*.45,Math.min(bw,bh)*.3,ox+bw*.5,oy+bh*.5,Math.max(bw,bh)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,20,40,.35)');g.fillStyle=vg;g.fillRect(ox,oy,bw,bh);
  const wl=g.createLinearGradient(ox+bw,oy+bh,ox,oy);wl.addColorStop(0,'rgba(255,170,90,.22)');wl.addColorStop(.5,'rgba(255,170,90,0)');
  g.fillStyle=wl;g.fillRect(ox,oy,bw,bh);
  g.restore();
  dirty=false;
}

/* ---------- characters ---------- */
function drawFluff(g,x,y,r,col,lx,ly,o){
  o=o||{};
  g.save();g.translate(x,y);
  g.fillStyle='rgba(0,0,0,.16)';g.beginPath();g.ellipse(0,r*.92,r*.72,r*.2,0,0,TAU);g.fill();
  if(o.wave){const w=Math.sin(t*22);g.fillStyle=col;g.beginPath();g.arc(r*.92,-r*.25+w*r*.18,r*.17,0,TAU);g.fill();
    g.beginPath();g.arc(-r*.92,-r*.25-w*r*.18,r*.17,0,TAU);g.fill();}
  g.beginPath();const n=11;
  for(let k=0;k<n;k++){const a=k/n*TAU+(o.spin||0);const cx=Math.cos(a)*r*.72,cy=Math.sin(a)*r*.72;g.moveTo(cx+r*.3,cy);g.arc(cx,cy,r*.3,0,TAU);}
  g.moveTo(r*.82,0);g.arc(0,0,r*.82,0,TAU);
  g.fillStyle=col;g.fill();
  const gr=g.createRadialGradient(-r*.3,-r*.38,r*.05,0,0,r*1.05);
  gr.addColorStop(0,'rgba(255,255,255,.6)');gr.addColorStop(.45,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(40,0,60,.2)');
  g.fillStyle=gr;g.fill();
  const rim=g.createRadialGradient(r*.55,r*.5,r*.1,r*.3,r*.3,r*1.1);rim.addColorStop(0,'rgba(255,190,110,.45)');rim.addColorStop(.5,'rgba(255,190,110,0)');
  g.fillStyle=rim;g.fill();
  g.fillStyle='rgba(120,0,40,.18)';
  g.beginPath();g.arc(-r*.5,r*.2,r*.14,0,TAU);g.arc(r*.5,r*.2,r*.14,0,TAU);g.fill();
  const ex=r*.3,ey=-r*.12,ew=r*.24,eh=r*.29;
  for(const sx of[-1,1]){
    const cx=sx*ex;
    if(o.dead){g.strokeStyle='#3a2350';g.lineWidth=r*.09;g.lineCap='round';g.beginPath();
      g.moveTo(cx-ew*.6,ey-ew*.6);g.lineTo(cx+ew*.6,ey+ew*.6);g.moveTo(cx+ew*.6,ey-ew*.6);g.lineTo(cx-ew*.6,ey+ew*.6);g.stroke();}
    else if(o.blink){g.strokeStyle='#3a2350';g.lineWidth=r*.08;g.lineCap='round';g.beginPath();g.arc(cx,ey,ew*.7,.15*Math.PI,.85*Math.PI);g.stroke();}
    else{
      g.fillStyle='#fff';g.strokeStyle='rgba(58,35,80,.35)';g.lineWidth=r*.04;
      g.beginPath();g.ellipse(cx,ey,ew,eh,0,0,TAU);g.fill();g.stroke();
      const pr=o.scared?ew*.32:ew*.56;
      const px=cx+lx*ew*.38,py=ey+ly*eh*.38;
      g.fillStyle='#2b1b3d';g.beginPath();g.arc(px,py,pr,0,TAU);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(px-pr*.35,py-pr*.4,pr*.38,0,TAU);g.fill();
    }
  }
  if(o.dead){g.strokeStyle='#3a2350';g.lineWidth=r*.07;g.beginPath();
    for(let k=0;k<=6;k++){const xx=-r*.22+k*r*.073,yy=r*.36+(k%2?-1:1)*r*.04;k?g.lineTo(xx,yy):g.moveTo(xx,yy);}g.stroke();}
  else if((o.mouth||0)>.05||o.scared){const m=o.scared?.7:o.mouth;
    g.fillStyle='#8a1f3d';g.beginPath();g.ellipse(0,r*.34,r*.2,r*.04+r*.16*m,0,0,TAU);g.fill();
    g.fillStyle='#ff7aa2';g.beginPath();g.ellipse(0,r*.34+r*.08*m,r*.11,r*.05*m+.01,0,0,TAU);g.fill();}
  else{g.strokeStyle='#3a2350';g.lineWidth=r*.07;g.lineCap='round';g.beginPath();g.arc(0,r*.2,r*.17,.15*Math.PI,.85*Math.PI);g.stroke();}
  if(o.crown){
    g.save();g.translate(r*.05,-r*.78);g.rotate(-.18);
    const cw=r*.46,ch=r*.38;
    g.beginPath();g.moveTo(-cw,ch*.25);g.lineTo(-cw,-ch*.55);g.lineTo(-cw*.5,-ch*.05);g.lineTo(0,-ch*.8);g.lineTo(cw*.5,-ch*.05);
    g.lineTo(cw,-ch*.55);g.lineTo(cw,ch*.25);g.closePath();
    g.fillStyle='#ffd23f';g.fill();g.strokeStyle='#c98a00';g.lineWidth=r*.05;g.lineJoin='round';g.stroke();
    g.fillStyle='#7bdff2';g.beginPath();g.arc(0,ch*.02,r*.08,0,TAU);g.fill();
    g.fillStyle='#fff';for(const px of[-cw,0,cw]){g.beginPath();g.arc(px,px?-ch*.55:-ch*.8,r*.05,0,TAU);g.fill();}
    g.restore();
  }
  g.restore();
}

function drawTreat(g,f,x,y,s){
  const tm=t+(f.seed||0);
  g.save();g.translate(x,y+Math.sin(tm*4)*s*.05);
  const pop=f.born!=null?easeOutBack(Math.min(1,(t-f.born)/.4)):1;g.scale(pop,pop);
  g.fillStyle='rgba(0,0,0,.15)';g.beginPath();g.ellipse(0,s*.38,s*.3,s*.08,0,0,TAU);g.fill();
  g.rotate(Math.sin(tm*2.5)*.12);
  if(f.type==='cup'){
    g.fillStyle='#4fc3f7';g.beginPath();g.moveTo(-s*.28,0);g.lineTo(s*.28,0);g.lineTo(s*.2,s*.33);g.lineTo(-s*.2,s*.33);g.closePath();g.fill();
    g.strokeStyle='rgba(255,255,255,.65)';g.lineWidth=s*.035;
    for(let k=-2;k<=2;k++){g.beginPath();g.moveTo(k*s*.1,s*.03);g.lineTo(k*s*.072,s*.3);g.stroke();}
    g.fillStyle='#fff0f6';g.beginPath();
    for(const c of[[-.17,-.02,.15],[.17,-.02,.15],[0,-.13,.19],[0,-.27,.12]]){g.moveTo(c[0]*s+c[2]*s,c[1]*s);g.arc(c[0]*s,c[1]*s,c[2]*s,0,TAU);}
    g.fill();
    const sc=['#ff5d8f','#ffd23f','#7bdff2','#a8e66f'];
    for(let k=0;k<7;k++){g.fillStyle=sc[k%4];g.save();g.translate(Math.cos(k*2.1)*s*.2,-s*.12+Math.sin(k*1.7)*s*.1);g.rotate(k);g.fillRect(-s*.035,-s*.012,s*.07,s*.025);g.restore();}
    g.strokeStyle='#5a8a2a';g.lineWidth=s*.03;g.beginPath();g.moveTo(s*.03,-s*.44);g.quadraticCurveTo(s*.06,-s*.55,s*.14,-s*.58);g.stroke();
    g.fillStyle='#e53950';g.beginPath();g.arc(s*.03,-s*.4,s*.085,0,TAU);g.fill();
    g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.arc(s*.0,-s*.43,s*.025,0,TAU);g.fill();
  }else if(f.type==='donut'){
    g.lineCap='round';
    g.strokeStyle='#d9954a';g.lineWidth=s*.3;g.beginPath();g.arc(0,0,s*.25,0,TAU);g.stroke();
    g.strokeStyle='#ff7eb6';g.lineWidth=s*.22;g.beginPath();g.arc(0,-s*.015,s*.25,0,TAU);g.stroke();
    g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=s*.05;g.beginPath();g.arc(0,-s*.015,s*.3,1.1*Math.PI,1.5*Math.PI);g.stroke();
    const sc=['#fff','#ffd23f','#7bdff2','#a8e66f'];g.lineWidth=s*.035;

/* ---------- game logic ---------- */
function occupied(x,y){
  if(snake&&snake.some(s=>s.x===x&&s.y===y))return true;
  if(food&&food.x===x&&food.y===y)return true;
  if(bonus&&bonus.x===x&&bonus.y===y)return true;
  return false;
}
function freeCell(){
  for(let k=0;k<400;k++){const x=Math.floor(Math.random()*G.cols),y=Math.floor(Math.random()*G.rows);if(!occupied(x,y))return{x,y};}
  for(let y=0;y<G.rows;y++)for(let x=0;x<G.cols;x++)if(!occupied(x,y))return{x,y};
  return null;
}
function placeFood(){food=null;const c=freeCell();food=c?{x:c.x,y:c.y,type:TYPES[Math.floor(Math.random()*TYPES.length)],born:t,seed:Math.random()*10}:null;}

function newGame(){
  chooseGrid();
  const cx=Math.floor(G.cols/2),cy=Math.floor(G.rows*.6);
  colorIdx=0;
  snake=[{x:cx,y:cy,c:-1},{x:cx,y:cy+1,c:colorIdx++},{x:cx,y:cy+2,c:colorIdx++}];
  prev=snake.map(s=>({x:s.x,y:s.y}));
  dir={x:0,y:-1};queue=[];score=0;combo=0;lastEat=-99;acc=0;interval=170;eaten=0;grow=0;
  bonus=null;villain=null;nextVillain=t+14;parts=[];floats=[];mouth=0;
  placeFood();state='ready';hud();
}
function step(){
  if(queue.length)dir=queue.shift();
  const h=snake[0],nx=h.x+dir.x,ny=h.y+dir.y;
  prev=snake.map(s=>({x:s.x,y:s.y}));
  if(nx<0||ny<0||nx>=G.cols||ny>=G.rows){die();return;}
  const eatF=!!(food&&nx===food.x&&ny===food.y);
  const eatB=!!(bonus&&bonus.landed&&nx===bonus.x&&ny===bonus.y);
  const len=(grow>0||eatF||eatB)?snake.length:snake.length-1;
  for(let i=0;i<len;i++)if(snake[i].x===nx&&snake[i].y===ny){die();return;}
  const tail={x:snake[snake.length-1].x,y:snake[snake.length-1].y};
  for(let i=snake.length-1;i>0;i--){snake[i].x=snake[i-1].x;snake[i].y=snake[i-1].y;}
  h.x=nx;h.y=ny;
  if(eatF)eat(false);
  if(eatB)eat(true);
  if(grow>0){grow--;snake.push({x:tail.x,y:tail.y,c:colorIdx++,born:t});prev.push({x:tail.x,y:tail.y});}
}
function eat(isB){
  combo=(t-lastEat<5)?Math.min(combo+1,5):1;lastEat=t;
  const pts=(isB?50:10)*combo;score+=pts;grow++;eaten++;
  interval=Math.max(78,170-eaten*3.2);
  const f=isB?bonus:food;const px=cxp(f.x),py=cyp(f.y);
  burst(px,py,isB?['#ffd23f','#fff3a0','#ffb300','#fff']:['#ff5d8f','#7bdff2','#ffd23f','#a8e66f','#c3a6ff'],isB?32:16);
  floats.push({x:px,y:py,text:'+'+pts,life:1,col:isB?'#ffd23f':'#fff'});
  if(combo>1)floats.push({x:px,y:py-G.cell*.8,text:'KOMBO x'+combo+'!',life:1.3,col:'#ffd25e'});
  sfx(isB?'bonus':'eat');vib(isB?[20,30,20]:12);
  if(isB)bonus=null;else placeFood();
  hud();
}
function die(){
  state='dying';deathT=t;shake=G.cell*.7;flash=.7;sfx('die');vib([80,50,160]);
  const h=snake[0];burst(cxp(h.x),cyp(h.y),['#fff','#ff5d8f','#ffd23f'],28);
}
function gameOver(){
  state='over';
  const best=scores.length?scores[0].s:0,rec=score>best&&score>0;
  const d=new Date();const entry={s:score,d:d.getDate()+'/'+(d.getMonth()+1)};
  scores.push(entry);scores.sort((a,b)=>b.s-a.s);scores=scores.slice(0,5);store.set('top',scores);
  $('ovTitle').textContent=rec?'Snyggt, Kerstin.':['Krock.','Där tog det slut.','Aj.','Kanten vann.','Nästan.'][Math.floor(Math.random()*5)];
  $('ovScore').textContent=score;
  $('ovInfo').textContent='Kedjan blev '+snake.length+' lång';
  $('recordBadge').classList.toggle('hidden',!rec);
  const ol=$('top');ol.innerHTML='';
  scores.forEach((s,i)=>{const li=document.createElement('li');
    li.innerHTML='<span>'+(i+1)+'</span><b>'+s.s+'</b><small>'+s.d+'</small>';
    if(s===entry)li.className='me';ol.appendChild(li);});
  $('over').classList.remove('hidden');
  if(rec){confetti();setTimeout(()=>sfx('record'),150);}
  hud();
}
function spawnVillain(){
  const c=freeCell();if(!c)return;
  const left=Math.random()<.5;
  villain={x:left?-G.cell*2:W+G.cell*2,vx:(left?1:-1)*G.cell*4.5,tx:cxp(c.x),cell:c,dropped:false,y:0};
  sfx('laugh');
}
function updVillain(dt){
  if(!villain){if(t>nextVillain&&!bonus)spawnVillain();return;}
  villain.y=G.oy+G.cell*.7;
  villain.x+=villain.vx*dt;
  if(!villain.dropped&&(villain.vx>0?villain.x>=villain.tx:villain.x<=villain.tx)){
    villain.dropped=true;
    let c=villain.cell;if(occupied(c.x,c.y))c=freeCell();
    if(c)bonus={x:c.x,y:c.y,type:'star',born:t,y0:villain.y,landed:false,seed:0};
  }
  if(villain.x<-G.cell*3||villain.x>W+G.cell*3){villain=null;nextVillain=t+16+Math.random()*10;}
}
function updBonus(){
  if(!bonus)return;
  if(!bonus.landed&&t-bonus.born>=.55){
    bonus.landed=true;bonus.landT=t;sfx('pop');
    burst(cxp(bonus.x),cyp(bonus.y)+G.cell*.3,['#fff','#e8ffd8'],10,G.cell*3);
    const h=snake[0];if(h.x===bonus.x&&h.y===bonus.y)eat(true);
  }else if(bonus.landed&&t-bonus.landT>7){
    burst(cxp(bonus.x),cyp(bonus.y),['#fff','#ffd23f'],12,G.cell*3);bonus=null;
  }
}
function burst(x,y,cols,n,sp){
  sp=sp||G.cell*6;
  for(let i=0;i<n;i++){const a=Math.random()*TAU,v=sp*(.3+Math.random()*.7);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,g:G.cell*14,col:cols[i%cols.length],sz:G.cell*(.1+Math.random()*.12),rot:Math.random()*6,vr:(Math.random()-.5)*12,life:1,max:.6+Math.random()*.6});}
}
function confetti(){
  const cols=['#ff5d8f','#7bdff2','#ffd23f','#a8e66f','#c3a6ff','#fff'];
  for(let i=0;i<140;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*80,vy:60+Math.random()*140,g:30,
    col:cols[i%cols.length],sz:6+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*10,life:1,max:3.5+Math.random()*2});
}

/* ---------- audio ---------- */
let ac=null;
function ensureAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();}
function tone(f,dur,type,vol,slide,delay){
  if(muted||!ac)return;
  const o=ac.createOscillator(),g=ac.createGain(),st=ac.currentTime+(delay||0);
  o.type=type||'square';o.frequency.setValueAtTime(f,st);
  if(slide&&slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),st+dur);
  g.gain.setValueAtTime(vol||.1,st);g.gain.exponentialRampToValueAtTime(.001,st+dur);
  o.connect(g).connect(ac.destination);o.start(st);o.stop(st+dur+.02);
}
function sfx(n){
  if(muted||!ac)return;
  switch(n){
    case 'eat':{const b=500+combo*70;tone(b,.08,'square',.05,1.6);tone(b*1.5,.1,'sine',.09,1.4,.05);break;}
    case 'bonus':[660,880,1100,1320,1760].forEach((f,i)=>tone(f,.12,'triangle',.09,1,i*.06));break;
    case 'die':tone(440,.6,'sawtooth',.07,.2);tone(220,.5,'square',.05,.3,.1);break;
    case 'start':tone(520,.1,'square',.05,1);tone(780,.14,'square',.05,1,.1);break;
    case 'laugh':[300,260,300,260,220].forEach((f,i)=>tone(f,.09,'triangle',.08,.85,i*.11));break;
    case 'record':[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.16,'square',.05,1,i*.12));break;
    case 'pop':tone(320,.12,'sine',.08,.5);break;
  }
}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- ui ---------- */
function hud(){
  $('sc').innerHTML='<span>Poäng</span>'+score;
  $('bs').innerHTML='<span>Bäst</span>'+Math.max(score,scores.length?scores[0].s:0);
}
function menuBest(){$('menuBest').textContent=scores.length?'Rekord: '+scores[0].s:'Inget rekord än';}
function start(){
  ['menu','over','pause'].forEach(id=>$(id).classList.add('hidden'));
  $('hud').classList.remove('hidden');newGame();sfx('start');
}
function toMenu(){
  ['over','pause','hud'].forEach(id=>$(id).classList.add('hidden'));
  state='menu';snake=null;food=null;bonus=null;villain=null;chooseGrid();menuBest();$('menu').classList.remove('hidden');
}
function togglePause(){
  if(state==='play'||state==='ready'){state='pause';$('pause').classList.remove('hidden');}
  else if(state==='pause'){state='play';$('pause').classList.add('hidden');}
}
$('play').onclick=()=>{ensureAudio();start();};
$('again').onclick=()=>{ensureAudio();start();};
$('toMenu').onclick=toMenu;
$('quit').onclick=toMenu;
$('resume').onclick=togglePause;
$('pauseBtn').onclick=togglePause;
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;store.set('muted',muted);$('mute').textContent=muted?'🔇':'🔊';ensureAudio();};

function turn(dx,dy){
  if(state==='ready'){state='play';if(dx===0&&dy===1)return;}
  if(state!=='play')return;
  const ld=queue.length?queue[queue.length-1]:dir;
  if((ld.x===-dx&&ld.y===-dy)||(ld.x===dx&&ld.y===dy))return;
  if(queue.length<3)queue.push({x:dx,y:dy});
}
let pt=null;
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))return;ensureAudio();pt={x:e.clientX,y:e.clientY,moved:false};});
addEventListener('pointermove',e=>{
  if(!pt)return;
  const dx=e.clientX-pt.x,dy=e.clientY-pt.y,th=Math.max(16,Math.min(W,H)*.04);
  if(Math.abs(dx)<th&&Math.abs(dy)<th)return;
  if(Math.abs(dx)>Math.abs(dy))turn(Math.sign(dx),0);else turn(0,Math.sign(dy));
  pt.x=e.clientX;pt.y=e.clientY;pt.moved=true;
});
addEventListener('pointerup',()=>{if(pt&&!pt.moved&&state==='ready')state='play';pt=null;});
addEventListener('pointercancel',()=>{pt=null;});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
  if(m[k]){e.preventDefault();ensureAudio();turn(m[k][0],m[k][1]);return;}
  if(k===' '||k==='p'||k==='Escape'){e.preventDefault();if(state==='ready')state='play';else togglePause();return;}
  if(k==='Enter'&&(state==='menu'||state==='over')){ensureAudio();start();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause();});
addEventListener('resize',resize);

/* ---------- loop ---------- */
function update(dt){
  for(const c of clouds){c.x+=c.v*dt;if(c.x-c.s>W)c.x=-c.s*1.5;}
  if(state==='play'){
    acc+=dt*1000;let guard=0;
    while(acc>=interval&&state==='play'&&guard++<5){acc-=interval;step();}
    if(state==='play'){updVillain(dt);updBonus();}
  }else if(state==='dying'&&t-deathT>1.3)gameOver();
  if(state==='dying'||state==='over'){if(villain){villain.x+=villain.vx*dt;if(villain.x<-G.cell*3||villain.x>W+G.cell*3)villain=null;}}
  for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.life-=dt/p.max;}
  parts=parts.filter(p=>p.life>0&&p.y<H+40);
  for(const f of floats){f.y-=G.cell*1.3*dt;f.life-=dt;}
  floats=floats.filter(f=>f.life>0);
  shake*=Math.pow(.02,dt);flash=Math.max(0,flash-dt*1.6);
  if(snake&&food){const h=snake[0];const dd=Math.abs(h.x-food.x)+Math.abs(h.y-food.y);mouth+=((dd<=2?1:0)-mouth)*Math.min(1,dt*12);}
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(dirty)buildCaches();
  ctx.drawImage(bgC,0,0,W,H);
  for(const c of clouds){ctx.fillStyle='rgba(255,214,190,.55)';ctx.beginPath();
    ctx.arc(c.x,c.y,c.s*.5,0,TAU);ctx.arc(c.x+c.s*.48,c.y+c.s*.12,c.s*.38,0,TAU);ctx.arc(c.x-c.s*.48,c.y+c.s*.14,c.s*.34,0,TAU);ctx.arc(c.x+c.s*.1,c.y-c.s*.25,c.s*.36,0,TAU);ctx.fill();}
  ctx.save();
  if(shake>.5)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.drawImage(boardC,0,0,W,H);
  const cell=G.cell;
  if(snake){
    if(food)drawTreat(ctx,food,cxp(food.x),cyp(food.y),cell);
    if(bonus){
      if(!bonus.landed){const p=Math.min(1,(t-bonus.born)/.55);drawTreat(ctx,bonus,cxp(bonus.x),lerp(bonus.y0,cyp(bonus.y),p*p),cell*1.1);}
      else{const left=7-(t-bonus.landT);
        if(!(left<2&&Math.sin(t*25)<0)){
          ctx.strokeStyle='rgba(255,210,63,.9)';ctx.lineWidth=Math.max(2,cell*.08);ctx.lineCap='round';
          ctx.beginPath();ctx.arc(cxp(bonus.x),cyp(bonus.y),cell*.62,-Math.PI/2,-Math.PI/2+TAU*left/7);ctx.stroke();
          drawTreat(ctx,bonus,cxp(bonus.x),cyp(bonus.y),cell*1.1);}}
    }
    const a=state==='play'?Math.min(1,acc/interval):1;
    const dying=state==='dying'||state==='over',dd=t-deathT;
    for(let i=snake.length-1;i>=0;i--){
      const s=snake[i],p=prev[i]||s;
      const gx=lerp(p.x,s.x,a),gy=lerp(p.y,s.y,a);
      let lx,ly;
      if(i===0){lx=dir.x;ly=dir.y;}else{lx=snake[i-1].x-s.x;ly=snake[i-1].y-s.y;}
      const sc=s.born!=null?Math.max(.01,easeOutBack(Math.min(1,(t-s.born)/.35))):1;
      let bob=Math.sin(t*9-i*.6)*cell*.05;
      if(dying&&i>0)bob-=Math.abs(Math.sin(dd*12+i))*cell*.3*Math.max(0,1-dd*.8);
      const r=(i===0?.64:Math.max(.4,.52-i*.003))*cell*sc;
      drawSeg(ctx,cxp(gx),cyp(gy)+bob,r,i,s.c,lx,ly,{
        blink:!dying&&((t*.8+i*.37)%3.5)<.12,
        mouth:i===0?mouth:0,crown:i===0,dead:i===0&&dying,scared:i>0&&dying,
        wave:s.born!=null&&t-s.born<.9});
    }
    if(state==='ready'){
      const k=1+Math.sin(t*5)*.06;
      ctx.save();ctx.translate(G.ox+G.cols*cell/2,G.oy+G.rows*cell*.3);ctx.scale(k,k);
      ctx.font='900 '+Math.max(22,cell*1.1)+"px 'Rubik',system-ui,sans-serif";ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.lineWidth=6;ctx.strokeStyle='#1c1238';ctx.lineJoin='round';ctx.strokeText('Svep för att starta',0,0);
      ctx.fillStyle='#fff';ctx.fillText('Svep för att starta',0,0);ctx.restore();
    }
  }
  if(villain)drawVillain(villain);
  for(const p of parts){ctx.save();ctx.globalAlpha=Math.min(1,p.life*2);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);ctx.restore();}
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  for(const f of floats){ctx.save();ctx.globalAlpha=Math.min(1,f.life*2);
    const s=1+Math.max(0,f.life-.8)*1.2;ctx.translate(f.x,f.y);ctx.scale(s,s);
    ctx.font='900 '+Math.max(16,cell*.75)+"px 'Rubik',system-ui,sans-serif";
    ctx.lineWidth=5;ctx.strokeStyle='#1c1238';ctx.strokeText(f.text,0,0);ctx.fillStyle=f.col;ctx.fillText(f.text,0,0);ctx.restore();}
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.6)+')';ctx.fillRect(0,0,W,H);}
}
function drawDemo(){
  const w=dc.clientWidth,h=dc.clientHeight;if(!w)return;
  if(dc.width!==Math.round(w*DPR)){dc.width=Math.round(w*DPR);dc.height=Math.round(h*DPR);}
  dctx.setTransform(DPR,0,0,DPR,0,0);dctx.clearRect(0,0,w,h);
  const r=h*.2,gap=r*1.85,n=7,span=w+gap*(n+3);
  const hx=(t*w*.28)%span-gap;
  const ty=x=>h*.55+Math.sin(x/w*Math.PI*3)*h*.13;
  const fx=hx+gap*1.6;if(fx<w+20)drawTreat(dctx,{type:'cup',seed:1},fx,ty(fx),r*2);
  for(let i=n-1;i>=0;i--){const x=hx-i*gap;if(x<-r*2||x>w+r*2)continue;
    drawSeg(dctx,x,ty(x)+Math.sin(t*9-i*.6)*r*.1,i?r:r*1.25,i,i-1,1,0,{crown:!i,blink:((t*.8+i*.37)%3.5)<.12});}
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  update(dt);render();if(state==='menu')drawDemo();
  requestAnimationFrame(loop);
}
resize();menuBest();renderSkins();hud();requestAnimationFrame(loop);
})();
</script>
